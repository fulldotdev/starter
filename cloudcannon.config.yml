collection_groups:
  - heading: Pages
    collections:
      - pages
      - products
      - categories
  - heading: Data
    collections:
      - reviews
      - globals
_inputs:
  pages:
    type: multiselect
    options:
      preview:
        text:
          - key: url
    label: Categorieën
    cascade: true
  meta:
    type: auto
    label: SEO
    cascade: true
  meta.title:
    type: auto
    label: Pagina title
    comment: 50 tot 60 karakters
    cascade: true
  meta.description:
    type: auto
    label: Pagina beschrijving
    comment: 50 tot 120 karakters
    cascade: true
  meta.image:
    type: auto
    label: Pagina afbeelding
    comment: Zichtbaar wanneer de pagina wordt gedeeld op social media
    cascade: true
  image:
    type: image
    options:
      mime_type: image/webp
      resize_style: contain
      width: 1920
      height: 1920
      expandable: false
      sizes: []
    label: Afbeelding
    cascade: true
  href:
    type: url
    label: Link
    cascade: true
  rating:
    type: range
    options:
      min: 0
      max: 5
      step: 0.1
    label: Rating
    cascade: true
  images:
    type: array
    cascade: true
  logo:
    type: image
    cascade: true
  images[*]:
    type: image
    options:
      paths:
      mime_type: image/webp
      empty_type:
      resize_style: contain
      width: 1920
      height: 1920
      expandable:
      allowed_sources:
      prevent_resize_existing_files:
      sizes:
    cascade: true
  draft:
    type: switch
    label: Concept
    cascade: true
  variant:
    type: auto
    hidden: true
    cascade: true
  price:
    type: number
    cascade: true
  paragraph:
    type: textarea
    cascade: true
_structures:
  blocks:
    remove_empty_inputs: true
    style: modal
_editables:
  content:
    allow_custom_markup: false
    remove_custom_markup: false
    bold: true
    bulletedlist: true
    format: p h1 h2 h3 h4 h5 h6
    image: true
    image_size_attributes: true
    italic: true
    link: true
    numberedlist: true
    redo: true
    table: true
    underline: true
    undo: true
timezone: Europe/Amsterdam
