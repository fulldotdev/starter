paths:
  uploads: src/assets/
  uploads_use_relative_path: true
timezone: Europe/Amsterdam
collections_config:
  pages:
    path: src/content/pages
    url: "/[full_slug]/"
    name: Pages
    icon: article
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    _enabled_editors:
      - visual
      - content
  globals:
    path: src/content/globals
    name: Globals
    icon: public
    disable_add: false
    disable_add_folder: true
    disable_file_actions: false
    _enabled_editors:
      - data
collection_groups:
  - heading: Content
    collections:
      - pages
      - globals
_inputs:
  type:
    type: select
    options:
      values:
        - home
        - about
        - service
        - contact
        - landing
      required: true
  name:
    type: text
    options:
      required: true
  slug:
    type: text
    comment: Optional route override. Leave empty to use the file path.
  seo.title:
    type: text
    options:
      required: true
  seo.description:
    type: textarea
    options:
      required: true
  seo.canonical:
    type: url
  seo.noindex:
    type: checkbox
  seo.nofollow:
    type: checkbox
  seo.image.src:
    type: image
    options:
      mime_type: image/webp
      resize_style: contain
      width: 2400
      height: 1600
  seo.image.alt:
    type: text
  hero.eyebrow:
    type: text
  hero.title:
    type: text
  hero.description:
    type: textarea
  hero.primaryCta.label:
    type: text
  hero.primaryCta.href:
    type: url
  hero.primaryCta.variant:
    type: select
    options:
      values:
        - default
        - secondary
        - outline
        - ghost
  hero.secondaryCta.label:
    type: text
  hero.secondaryCta.href:
    type: url
  hero.secondaryCta.variant:
    type: select
    options:
      values:
        - default
        - secondary
        - outline
        - ghost
  hero.image.src:
    type: image
    options:
      mime_type: image/webp
      resize_style: contain
      width: 2400
      height: 1600
  hero.image.alt:
    type: text
  intro.eyebrow:
    type: text
  intro.title:
    type: text
  intro.description:
    type: textarea
  summary.eyebrow:
    type: text
  summary.title:
    type: text
  summary.description:
    type: textarea
  features:
    type: array
    options:
      empty_type: array
  features[*].title:
    type: text
  features[*].description:
    type: textarea
  ctaPanel.title:
    type: text
  ctaPanel.description:
    type: textarea
  ctaPanel.cta.label:
    type: text
  ctaPanel.cta.href:
    type: url
  ctaPanel.cta.variant:
    type: select
    options:
      values:
        - default
        - secondary
        - outline
        - ghost
  principles:
    type: array
    options:
      empty_type: array
  principles[*]:
    type: text
  milestones:
    type: array
    options:
      empty_type: array
  milestones[*].title:
    type: text
  milestones[*].description:
    type: textarea
  deliverables:
    type: array
    options:
      empty_type: array
  deliverables[*]:
    type: text
  process:
    type: array
    options:
      empty_type: array
  process[*].title:
    type: text
  process[*].description:
    type: textarea
  methods:
    type: array
    options:
      empty_type: array
  methods[*].label:
    type: text
  methods[*].value:
    type: text
  methods[*].href:
    type: url
  availability:
    type: array
    options:
      empty_type: array
  availability[*]:
    type: text
  proofPoints:
    type: array
    options:
      empty_type: array
  proofPoints[*]:
    type: text
  faq:
    type: array
    options:
      empty_type: array
  faq[*].title:
    type: text
  faq[*].description:
    type: textarea
  locale:
    type: select
    options:
      values:
        - en
        - nl
      required: true
  siteName:
    type: text
    options:
      required: true
  logo.src:
    type: image
    options:
      mime_type: image/webp
      resize_style: contain
      width: 1600
      height: 1600
  logo.alt:
    type: text
  announcement.label:
    type: text
  announcement.text:
    type: text
  navigation:
    type: array
    options:
      empty_type: array
  navigation[*].label:
    type: text
  navigation[*].href:
    type: url
  cta.label:
    type: text
  cta.href:
    type: url
  cta.variant:
    type: select
    options:
      values:
        - default
        - secondary
        - outline
        - ghost
  tagline:
    type: textarea
  contact:
    type: array
    options:
      empty_type: array
  contact[*].label:
    type: text
  contact[*].value:
    type: text
  contact[*].href:
    type: url
  social:
    type: array
    options:
      empty_type: array
  social[*].label:
    type: text
  social[*].href:
    type: url
_editables:
  content:
    allow_custom_markup: false
    remove_custom_markup: false
    blockquote: true
    bold: true
    bulletedlist: true
    format: p h1 h2 h3 h4 h5 h6
    italic: true
    link: true
    numberedlist: true
    redo: true
    table: false
    underline: true
    undo: true
    image: true
    height: 2400
    width: 2400
    resize_style: contain
    mime_type: image/webp
